<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AIROOM - Interactive AR Zoo</title>

  <!-- A-Frame & 8th Wall Extras -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- Self-Hosted 8th Wall XR Engine Binary with SLAM chunk preloaded -->
  <script async src="./xr.js" data-preload-chunks="slam"></script>

  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a;
    }

    /* Custom Branded Loading Screen */
    #custom-loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .poweredby-img, #poweredByLogo, #loadingContainer {
      display: none !important;
    }

    /* Instruction Banner before tapping floor */
    #hint-banner {
      position: fixed; 
      top: 24px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); 
      color: #fff; 
      padding: 12px 22px;
      border-radius: 30px; 
      font-size: 14px; 
      font-weight: 500; 
      z-index: 10;
      backdrop-filter: blur(8px); 
      pointer-events: none; 
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      transition: background 0.25s ease;
    }

    #hint-banner.ready {
      background: rgba(16, 185, 129, 0.9);
    }

    /* Bottom Theme Switcher Dock */
    #theme-dock {
      position: fixed; 
      bottom: 24px; 
      left: 50%; 
      transform: translateX(-50%);
      display: none; 
      gap: 6px; 
      background: rgba(15, 23, 42, 0.88);
      padding: 6px; 
      border-radius: 40px; 
      z-index: 10;
      backdrop-filter: blur(10px); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      max-width: calc(100vw - 24px);
      overflow-x: auto;
    }

    .theme-btn {
      border: none; 
      padding: 10px 14px; 
      border-radius: 30px;
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer;
      color: #cbd5e1; 
      background: transparent; 
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .theme-btn.active {
      background: #0ea5e9; 
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(14, 165, 233, 0.45);
    }

    /* Active Zone Pill Banner (Top-Left after placing) */
    #zone-badge {
      position: fixed;
      top: 24px;
      left: 16px;
      z-index: 10;
      display: none;
      background: rgba(15, 23, 42, 0.82);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    /* Top-Right Action Buttons */
    .ar-ctrl-btn {
      position: fixed; 
      right: 16px; 
      z-index: 10;
      background: rgba(15, 23, 42, 0.78); 
      color: #fff; 
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%; 
      width: 44px; 
      height: 44px; 
      font-size: 18px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    #recenter-btn { top: 24px; }
    #reposition-btn { top: 78px; display: none; font-size: 16px; }
  </style>

  <script>
    // =========================================================================
    // 1. GLB ANIMATION PLAYER COMPONENT (Plays baked AnimationClips in .GLB)
    // =========================================================================
    AFRAME.registerComponent('glb-animator', {
      schema: {
        speed: { type: 'number', default: 1.0 }
      },
      init: function () {
        this.mixer = null;

        this.startAnimations = (model) => {
          if (!model) return;

          // Prevent animated skinned meshes from disappearing near screen edges
          model.traverse((obj) => {
            if (obj.isMesh || obj.isSkinnedMesh) {
              obj.frustumCulled = false;
            }
          });

          if (model.animations && model.animations.length > 0) {
            this.mixer = new THREE.AnimationMixer(model);
            this.mixer.timeScale = this.data.speed;
            model.animations.forEach((clip) => {
              const action = this.mixer.clipAction(clip);
              action.setLoop(THREE.LoopRepeat, Infinity);
              action.play();
            });
          }
        };

        // Handle both future model-loaded events and already-loaded models
        this.el.addEventListener('model-loaded', (e) => {
          this.startAnimations(e.detail.model);
        });

        const existingMesh = this.el.getObject3D('mesh');
        if (existingMesh) {
          this.startAnimations(existingMesh);
        }
      },
      tick: function (time, delta) {
        if (this.mixer) {
          // Clamp delta to avoid huge jumps when switching tabs
          this.mixer.update(Math.min(delta, 50) / 1000);
        }
      }
    });

    // =========================================================================
    // 2. FLOOR RETICLE & LOCKED ROOM ANCHOR MANAGER
    // =========================================================================
    AFRAME.registerComponent('room-anchor-manager', {
      init: function () {
        this.scene = this.el;
        this.cameraEl = document.querySelector('a-camera');
        this.roomRoot = document.getElementById('room-origin');
        this.reticle = document.getElementById('placement-reticle');
        this.hintBanner = document.getElementById('hint-banner');
        this.zoneBadge = document.getElementById('zone-badge');
        this.themeDock = document.getElementById('theme-dock');
        this.repositionBtn = document.getElementById('reposition-btn');
        this.customLoader = document.getElementById('custom-loader');

        this.isAnchored = false;
        this.realityReady = false;
        this.hasValidFloorHit = false;

        // Mathematical SLAM floor plane (y = 0) and reusable Three.js vectors
        this.raycaster = new THREE.Raycaster();
        this.centerNDC = new THREE.Vector2(0, 0);
        this.groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        this.hitPoint = new THREE.Vector3();
        this.camPos = new THREE.Vector3();
        this.camDir = new THREE.Vector3();

        // 1. Hide custom loading screen once 8th Wall SLAM camera is ready
        this.scene.addEventListener('realityready', () => {
          this.realityReady = true;
          if (this.customLoader) {
            this.customLoader.style.opacity = '0';
            setTimeout(() => this.customLoader.remove(), 400);
          }
        });

        // 2. Tap once to lock the room permanently onto the reticle's floor position
        const placeRoom = (e) => {
          if (this.isAnchored || !this.hasValidFloorHit) return;
          if (e.target.closest('button') || e.target.closest('#theme-dock')) return;

          const cameraObj = this.cameraEl.getObject3D('camera');
          if (!cameraObj) return;

          // Compute yaw so the scene faces the user
          cameraObj.getWorldDirection(this.camDir);
          const yawDeg = THREE.MathUtils.radToDeg(Math.atan2(-this.camDir.x, -this.camDir.z));

          // Unlock matrix briefly, set exact floor position & rotation, then freeze it
          this.roomRoot.object3D.matrixAutoUpdate = true;
          this.roomRoot.setAttribute('position', `${this.hitPoint.x.toFixed(3)} 0 ${this.hitPoint.z.toFixed(3)}`);
          this.roomRoot.setAttribute('rotation', `0 ${yawDeg.toFixed(2)} 0`);
          this.roomRoot.object3D.updateMatrix();
          this.roomRoot.object3D.matrixAutoUpdate = false;

          this.roomRoot.setAttribute('visible', 'true');
          this.reticle.setAttribute('visible', 'false');
          this.isAnchored = true;

          // Update UI
          this.hintBanner.style.display = 'none';
          this.zoneBadge.style.display = 'block';
          this.themeDock.style.display = 'flex';
          this.repositionBtn.style.display = 'flex';
        };

        window.addEventListener('click', placeRoom);

        // 3. Recenter AR tracking
        document.getElementById('recenter-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          this.scene.emit('recenter');
        });

        // 4. Reposition button: unlocks the room so you can place it somewhere else
        this.repositionBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.isAnchored = false;
          this.roomRoot.object3D.matrixAutoUpdate = true;
          this.roomRoot.setAttribute('visible', 'false');
          this.zoneBadge.style.display = 'none';
          this.themeDock.style.display = 'none';
          this.repositionBtn.style.display = 'none';
          this.hintBanner.style.display = 'block';
          this.hintBanner.textContent = 'Point down at the floor to place';
          this.hintBanner.classList.remove('ready');
        });
      },

      // Continuously project the center of the camera onto the y = 0 SLAM floor ONLY before placement
      tick: function () {
        if (this.isAnchored || !this.realityReady) return;

        const cameraObj = this.cameraEl.getObject3D('camera');
        if (!cameraObj) return;

        this.raycaster.setFromCamera(this.centerNDC, cameraObj);
        const intersected = this.raycaster.ray.intersectPlane(this.groundPlane, this.hitPoint);

        if (intersected) {
          cameraObj.getWorldPosition(this.camPos);
          const dist = this.camPos.distanceTo(this.hitPoint);

          if (dist >= 0.8 && dist <= 8.0) {
            this.reticle.object3D.position.set(this.hitPoint.x, 0.01, this.hitPoint.z);
            this.reticle.setAttribute('visible', 'true');

            if (!this.hasValidFloorHit) {
              this.hasValidFloorHit = true;
              this.hintBanner.textContent = 'Floor locked! Tap anywhere to place';
              this.hintBanner.classList.add('ready');
            }
            return;
          }
        }

        if (this.hasValidFloorHit) {
          this.hasValidFloorHit = false;
          this.reticle.setAttribute('visible', 'false');
          this.hintBanner.textContent = 'Point your phone down at the floor';
          this.hintBanner.classList.remove('ready');
        }
      }
    });

    const ZONE_LABELS = {
      aquarium: '🌊 Zone 1: Aquarium & Ocean Dome (Look up!)',
      aviary:   '🦋 Zone 2: Aviary & Sky Sanctuary',
      reptiles: '🦎 Zone 3: Rainforest & Reptile House',
      meadow:   '🦌 Zone 4: Wildlife Meadow'
    };

    // Global function to switch AR Zoo habitats anywhere in the room instantly
    function switchTheme(zoneName, btnElement) {
      const zones = ['aquarium', 'aviary', 'reptiles', 'meadow'];
      
      zones.forEach(z => {
        const container = document.getElementById(`theme-${z}`);
        if (container) {
          container.setAttribute('visible', z === zoneName);
        }
      });

      const zoneBadge = document.getElementById('zone-badge');
      if (zoneBadge && ZONE_LABELS[zoneName]) {
        zoneBadge.textContent = ZONE_LABELS[zoneName];
      }

      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
</head>

<body>
  <!-- Custom Loading Screen -->
  <div id="custom-loader">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-size: 14px; font-weight: 500; letter-spacing: 0.5px;">Initializing AR Zoo...</p>
  </div>

  <!-- UI Overlays -->
  <div id="hint-banner">Point your phone down at the floor</div>
  <div id="zone-badge">🌊 Zone 1: Aquarium & Ocean Dome (Look up!)</div>
  <button id="recenter-btn" class="ar-ctrl-btn" title="Recenter AR">⟲</button>
  <button id="reposition-btn" class="ar-ctrl-btn" title="Move Zoo">📍</button>

  <div id="theme-dock">
    <button class="theme-btn active" onclick="switchTheme('aquarium', this)">🌊 Aquarium</button>
    <button class="theme-btn" onclick="switchTheme('aviary', this)">🦋 Aviary</button>
    <button class="theme-btn" onclick="switchTheme('reptiles', this)">🦎 Reptiles</button>
    <button class="theme-btn" onclick="switchTheme('meadow', this)">🦌 Meadow</button>
  </div>

  <!-- 8th Wall World Effects Scene -->
  <a-scene
    room-anchor-manager
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <!-- =================================================================== -->
    <!-- PRELOADED 3D AR ZOO ASSETS (Place Zone 1 .glb files in zoo/aquarium)-->
    <!-- =================================================================== -->
    <a-assets timeout="25000">
      <!-- Zone 1: Aquarium & Ocean Dome -->
      <a-asset-item id="model-koi-fish" src="./assets/models/zoo/aquarium/koi-fish-group.glb"></a-asset-item>
      <a-asset-item id="model-sea-turtle" src="./assets/models/zoo/aquarium/green-sea-turtle.glb"></a-asset-item>
      <a-asset-item id="model-manta-ray" src="./assets/models/zoo/aquarium/spotted-manta-ray.glb"></a-asset-item>
      <a-asset-item id="model-jellyfish" src="./assets/models/zoo/aquarium/moon-jellyfish-group.glb"></a-asset-item>

      <!-- Zone 2: Aviary (Uncomment as you add models to assets/models/zoo/aviary/) -->
      <!-- <a-asset-item id="model-butterflies" src="./assets/models/zoo/aviary/butterfly-swarm.glb"></a-asset-item> -->
      <!-- <a-asset-item id="model-barn-owl" src="./assets/models/zoo/aviary/barn-owl.glb"></a-asset-item> -->
      <!-- <a-asset-item id="model-crane" src="./assets/models/zoo/aviary/red-crowned-crane.glb"></a-asset-item> -->

      <!-- Zone 3: Reptiles (Uncomment as you add models to assets/models/zoo/reptiles/) -->
      <!-- <a-asset-item id="model-tree-boa" src="./assets/models/zoo/reptiles/emerald-tree-boa.glb"></a-asset-item> -->
      <!-- <a-asset-item id="model-tree-frog" src="./assets/models/zoo/reptiles/japanese-tree-frog.glb"></a-asset-item> -->

      <!-- Zone 4: Wildlife Meadow (Uncomment as you add models to assets/models/zoo/meadow/) -->
      <!-- <a-asset-item id="model-sika-deer" src="./assets/models/zoo/meadow/nara-sika-deer.glb"></a-asset-item> -->
      <!-- <a-asset-item id="model-red-fox" src="./assets/models/zoo/meadow/british-red-fox.glb"></a-asset-item> -->
    </a-assets>

    <!-- Camera (Disable A-Frame's built-in controls so 8th Wall SLAM has full control) -->
    <a-camera position="0 1.6 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

    <!-- Live Floor Placement Reticle -->
    <a-entity id="placement-reticle" visible="false">
      <a-ring rotation="-90 0 0" radius-inner="0.22" radius-outer="0.28" color="#10b981" material="shader: flat; opacity: 0.9"></a-ring>
      <a-circle rotation="-90 0 0" radius="0.06" color="#ffffff" material="shader: flat; opacity: 0.9"></a-circle>
    </a-entity>

    <!-- Ambient & Directional Lighting -->
    <a-light type="ambient" intensity="0.9"></a-light>
    <a-light type="directional" position="2 5 3" intensity="1.0"></a-light>

    <!-- =================================================================== -->
    <!-- ROOM ORIGIN (0, 0, 0) - Locked permanently after tapping the floor  -->
    <!-- =================================================================== -->
    <a-entity id="room-origin" visible="false">

      <!-- ZONE 1: AQUARIUM & OCEAN DOME (Active by default — Multi-level 360° layout) -->
      <a-entity id="theme-aquarium" visible="true">
        <!-- Floor Level: Swimming Koi Fish Pond -->
        <a-gltf-model
          src="#model-koi-fish"
          position="0 0.15 -2.2"
          scale="1.2 1.2 1.2"
          glb-animator="speed: 1.0">
        </a-gltf-model>

        <!-- Eye Level: Green Sea Turtle gliding in a wide calm loop -->
        <a-gltf-model
          src="#model-sea-turtle"
          position="0 1.10 -2.3"
          scale="1.0 1.0 1.0"
          glb-animator="speed: 1.0">
        </a-gltf-model>

        <!-- Overhead Ceiling Level: Spotted Manta Ray soaring above -->
        <a-gltf-model
          src="#model-manta-ray"
          position="0 2.05 -2.4"
          scale="1.15 1.15 1.15"
          glb-animator="speed: 0.9">
        </a-gltf-model>

        <!-- Left Corner: Glowing Moon Jellyfish Group -->
        <a-gltf-model
          src="#model-jellyfish"
          position="-1.45 0.95 -1.8"
          scale="1.0 1.0 1.0"
          glb-animator="speed: 1.0">
        </a-gltf-model>

        <!-- Right-Rear Corner: Second Moon Jellyfish Cluster (Turn around to discover!) -->
        <a-gltf-model
          src="#model-jellyfish"
          position="1.55 1.10 -1.4"
          rotation="0 140 0"
          scale="0.85 0.85 0.85"
          glb-animator="speed: 0.85">
        </a-gltf-model>
      </a-entity>

      <!-- ZONE 2: AVIARY & SKY SANCTUARY -->
      <a-entity id="theme-aviary" visible="false">
        <!-- Uncomment once Zone 2 models are added -->
        <!-- <a-gltf-model src="#model-butterflies" position="0 1.4 -2.0" scale="1 1 1" glb-animator></a-gltf-model> -->
        <!-- <a-gltf-model src="#model-barn-owl" position="0 2.1 -2.4" scale="1 1 1" glb-animator></a-gltf-model> -->
      </a-entity>

      <!-- ZONE 3: RAINFOREST & REPTILE HOUSE -->
      <a-entity id="theme-reptiles" visible="false">
        <!-- Uncomment once Zone 3 models are added -->
        <!-- <a-gltf-model src="#model-tree-boa" position="0 0.02 -2.0" scale="1 1 1" glb-animator></a-gltf-model> -->
        <!-- <a-gltf-model src="#model-tree-frog" position="0.8 0.0 -1.5" scale="1 1 1" glb-animator></a-gltf-model> -->
      </a-entity>

      <!-- ZONE 4: WILDLIFE MEADOW -->
      <a-entity id="theme-meadow" visible="false">
        <!-- Uncomment once Zone 4 models are added -->
        <!-- <a-gltf-model src="#model-sika-deer" position="0 0 -2.6" scale="1 1 1" glb-animator></a-gltf-model> -->
        <!-- <a-gltf-model src="#model-red-fox" position="-1.4 0 -2.0" rotation="0 25 0" scale="1 1 1" glb-animator></a-gltf-model> -->
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
