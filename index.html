<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AIROOM - Multi-Theme WebAR</title>

  <!-- A-Frame & 8th Wall Extras -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- Self-Hosted 8th Wall XR Engine Binary with SLAM chunk preloaded -->
  <script async src="./xr.js" data-preload-chunks="slam"></script>

  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a;
    }

    /* Custom Branded Loading Screen */
    #custom-loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .poweredby-img, #poweredByLogo, #loadingContainer {
      display: none !important;
    }

    /* Instruction Banner before tapping floor */
    #hint-banner {
      position: fixed; 
      top: 24px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); 
      color: #fff; 
      padding: 12px 22px;
      border-radius: 30px; 
      font-size: 14px; 
      font-weight: 500; 
      z-index: 10;
      backdrop-filter: blur(8px); 
      pointer-events: none; 
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    /* Bottom Theme Switcher Dock */
    #theme-dock {
      position: fixed; 
      bottom: 28px; 
      left: 50%; 
      transform: translateX(-50%);
      display: none; 
      gap: 8px; 
      background: rgba(15, 23, 42, 0.88);
      padding: 8px; 
      border-radius: 40px; 
      z-index: 10;
      backdrop-filter: blur(10px); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .theme-btn {
      border: none; 
      padding: 10px 16px; 
      border-radius: 30px;
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer;
      color: #cbd5e1; 
      background: transparent; 
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .theme-btn.active {
      background: #10b981; 
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    /* Recenter Button */
    #recenter-btn {
      position: fixed; 
      top: 24px; 
      right: 16px; 
      z-index: 10;
      background: rgba(15, 23, 42, 0.75); 
      color: #fff; 
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; 
      width: 42px; 
      height: 42px; 
      font-size: 18px; 
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script>
    AFRAME.registerComponent('room-anchor-manager', {
      init: function () {
        const scene = this.el;
        const roomRoot = document.getElementById('room-origin');
        const hintBanner = document.getElementById('hint-banner');
        const themeDock = document.getElementById('theme-dock');
        const customLoader = document.getElementById('custom-loader');
        let isAnchored = false;

        // 1. Hide custom loading screen once AR camera feed is ready
        scene.addEventListener('realityready', () => {
          if (customLoader) {
            customLoader.style.opacity = '0';
            setTimeout(() => customLoader.remove(), 400);
          }
        });

        // 2. Tap anywhere on the screen to place the (0,0,0) room anchor on the floor
        scene.addEventListener('click', (event) => {
          if (isAnchored) return;

          const touchPoint = event.detail.intersection 
            ? event.detail.intersection.point 
            : { x: 0, y: 0, z: -2.5 };
          
          roomRoot.setAttribute('position', `${touchPoint.x} ${touchPoint.y} ${touchPoint.z}`);
          roomRoot.setAttribute('visible', 'true');
          isAnchored = true;

          // Update UI
          hintBanner.style.display = 'none';
          themeDock.style.display = 'flex';
        });

        // 3. Recenter button lets user reset AR tracking if needed
        document.getElementById('recenter-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          scene.emit('recenter');
        });
      }
    });

    // Global function to switch themes anywhere in the room instantly
    function switchTheme(themeName, btnElement) {
      const themes = ['japan', 'uk', 'korea'];
      
      themes.forEach(t => {
        const container = document.getElementById(`theme-${t}`);
        if (container) {
          container.setAttribute('visible', t === themeName);
        }
      });

      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
</head>

<body>
  <!-- Custom Loading Screen -->
  <div id="custom-loader">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-size: 14px; font-weight: 500; letter-spacing: 0.5px;">Initializing AR Room...</p>
  </div>

  <!-- UI Overlays -->
  <div id="hint-banner">Point at the floor & tap once to place the room</div>
  <button id="recenter-btn" title="Recenter AR">⟲</button>

  <div id="theme-dock">
    <button class="theme-btn active" onclick="switchTheme('japan', this)">🇯🇵 Japan</button>
    <button class="theme-btn" onclick="switchTheme('uk', this)">🇬🇧 UK</button>
    <button class="theme-btn" onclick="switchTheme('korea', this)">🇰🇷 Korea</button>
  </div>

  <!-- 8th Wall World Effects Scene -->
  <a-scene
    room-anchor-manager
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <!-- =================================================================== -->
    <!-- PRELOADED 3D ASSETS (Place your .glb files in these folders)        -->
    <!-- =================================================================== -->
    <a-assets timeout="15000">
      <!-- Japan Models -->
      <a-asset-item id="model-torii-gate" src="./assets/models/japan/torii-gate.glb"></a-asset-item>
      <a-asset-item id="model-toro-lantern" src="./assets/models/japan/toro-stone-lantern.glb"></a-asset-item>
      <a-asset-item id="model-sakura-tree" src="./assets/models/japan/sakura-tree.glb"></a-asset-item>
      <a-asset-item id="model-shishi-odoshi" src="./assets/models/japan/shishi-odoshi.glb"></a-asset-item>

      <!-- UK Models -->
      <a-asset-item id="model-uk-1" src="./assets/models/uk/phone_booth.glb"></a-asset-item>
      <a-asset-item id="model-uk-2" src="./assets/models/uk/big_ben.glb"></a-asset-item>
      <a-asset-item id="model-uk-3" src="./assets/models/uk/lamp_post.glb"></a-asset-item>

      <!-- Korea Models -->
      <a-asset-item id="model-korea-1" src="./assets/models/korea/hanok_gate.glb"></a-asset-item>
      <a-asset-item id="model-korea-2" src="./assets/models/korea/lantern.glb"></a-asset-item>
      <a-asset-item id="model-korea-3" src="./assets/models/korea/jangdokdae.glb"></a-asset-item>
    </a-assets>

    <!-- Camera & Ground Raycaster -->
    <a-camera position="0 1.6 0" raycaster="objects: .ground-plane" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- Invisible Floor Plane for Tap-to-Place Raycasting -->
    <a-plane class="ground-plane" position="0 0 0" rotation="-90 0 0" width="50" height="50" visible="false"></a-plane>

    <!-- Ambient & Directional Lighting -->
    <a-light type="ambient" intensity="0.9"></a-light>
    <a-light type="directional" position="2 5 3" intensity="1.0"></a-light>

    <!-- =================================================================== -->
    <!-- ROOM ORIGIN (0, 0, 0) - Everything below anchors to your floor tap  -->
    <!-- =================================================================== -->
    <a-entity id="room-origin" visible="false">

      <!-- THEME 1: JAPAN (Active by default) -->
      <a-entity id="theme-japan" visible="true">
        <!-- Center-Back Torii Gate -->
        <a-gltf-model src="#model-torii-gate" position="0 0 -3.2" scale="0.7 0.7 0.7"></a-gltf-model>
        <!-- Left Sakura Tree -->
        <a-gltf-model src="#model-sakura-tree" position="-2.2 0 -2.8" scale="0.75 0.75 0.75"></a-gltf-model>
        <!-- Right Stone Lantern -->
        <a-gltf-model src="#model-toro-lantern" position="1.8 0 -2.4" rotation="0 -25 0" scale="0.8 0.8 0.8"></a-gltf-model>
        <!-- Foreground Shishi-odoshi -->
        <a-gltf-model src="#model-shishi-odoshi" position="-1.1 0 -1.5" rotation="0 30 0" scale="1 1 1"></a-gltf-model>
      </a-entity>

      <!-- THEME 2: UK -->
      <a-entity id="theme-uk" visible="false">
        <a-gltf-model src="#model-uk-1" position="-1.8 0 -2.8" rotation="0 20 0" scale="1 1 1"></a-gltf-model>
        <a-gltf-model src="#model-uk-2" position="0 0 -3.5" scale="1 1 1"></a-gltf-model>
        <a-gltf-model src="#model-uk-3" position="1.9 0 -2.6" rotation="0 -20 0" scale="1 1 1"></a-gltf-model>
      </a-entity>

      <!-- THEME 3: KOREA -->
      <a-entity id="theme-korea" visible="false">
        <a-gltf-model src="#model-korea-1" position="0 0 -3.2" scale="1 1 1"></a-gltf-model>
        <a-gltf-model src="#model-korea-2" position="-1.8 0 -2.4" rotation="0 25 0" scale="1 1 1"></a-gltf-model>
        <a-gltf-model src="#model-korea-3" position="1.8 0 -2.4" rotation="0 -25 0" scale="1 1 1"></a-gltf-model>
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
